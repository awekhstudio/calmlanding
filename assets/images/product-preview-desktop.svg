<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
<title id="title">Northwind Notes product interface</title><desc id="desc">A calm product notes workspace with sidebar navigation, decision content, and recent activity.</desc>
<rect width="1200" height="780" rx="24" fill="#f7f4ed"/><rect x="0" width="250" height="780" fill="#e8e3d9"/><circle cx="38" cy="38" r="8" fill="#415b4d"/><text x="58" y="45" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#202522">Northwind Notes</text>
<text x="30" y="105" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#777b76">WORKSPACE</text><g font-family="Arial,sans-serif" font-size="17" fill="#343834"><text x="30" y="150">Overview</text><text x="30" y="195">Notes</text><text x="30" y="240">Decisions</text><text x="30" y="285">Research</text></g><rect x="18" y="211" width="214" height="42" rx="9" fill="#d2dbd3"/>
<text x="290" y="58" font-family="Arial,sans-serif" font-size="14" fill="#777b76">Product / Atlas Mobile</text><text x="290" y="125" font-family="Georgia,serif" font-size="44" fill="#202522">Offline mode decision</text><text x="290" y="166" font-family="Arial,sans-serif" font-size="17" fill="#666a65">Updated July 24 by Mira Anand</text><line x1="290" y1="205" x2="1140" y2="205" stroke="#d7d1c7"/>
<text x="290" y="255" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#415b4d">CONTEXT</text><text x="290" y="300" font-family="Georgia,serif" font-size="27" fill="#202522">Customers need dependable access during field visits.</text><text x="290" y="345" font-family="Arial,sans-serif" font-size="17" fill="#666a65">Connectivity is inconsistent for teams working outside major cities.</text>
<rect x="290" y="395" width="850" height="155" rx="16" fill="#ece8df"/><text x="320" y="435" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#415b4d">DECISION</text><text x="320" y="480" font-family="Georgia,serif" font-size="27" fill="#202522">Ship read-only offline access in version 2.4.</text><text x="320" y="520" font-family="Arial,sans-serif" font-size="16" fill="#666a65">Editing remains online while sync reliability is tested.</text>
<text x="290" y="610" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#415b4d">NEXT STEPS</text><circle cx="303" cy="655" r="8" fill="none" stroke="#415b4d" stroke-width="2"/><text x="327" y="662" font-family="Arial,sans-serif" font-size="17" fill="#343834">Prototype cached project views</text><circle cx="303" cy="705" r="8" fill="none" stroke="#415b4d" stroke-width="2"/><text x="327" y="712" font-family="Arial,sans-serif" font-size="17" fill="#343834">Test with five field teams</text>
</svg>
